# Test kinematics services (FK and IK) for the Universal Robots UR10e (ur10e).
# Both are now part of the unified_planner node (lazy warmup via service call).
# The model resolves from the robots/ur10e.yaml descriptor via the
# gen_traj_test_ur10e.launch.py launch file.

package: isaac_ros_cumotion
environment:
  launch:
    - package: isaac_ros_cumotion
      executable: gen_traj_test_ur10e.launch.py
      name: gen_traj
  # Readiness is probed, not guessed: the planner node blocks its executor for
  # 25-35s building cuRobo solvers inside __init__ (it serves nothing until the
  # constructor returns), so the former `startup_delay: 30.0` was racing it --
  # measured margin ranged from +0.9s to -4.5s, which is exactly why `colcon
  # test` failed on a different subset of suites every run.
  # Waited for by *advertisement*, never called: the node creates this service
  # only after _warmup_initial_planner returns (unified_planner_node.py), so its
  # appearance in the graph is the readiness signal. There is deliberately no
  # readiness service to call: the node exposes its state as the
  # `node_is_available` parameter.
  ready_service: "/unified_planner/generate_trajectory"
  ready_wait: 180.0
  startup_delay: 0.0
  ready_timeout: 90.0  # ReadyToTest budget, loader-side (default is 15s)
  allowable_exit_codes: [0, -2, -9]

tests:
  - name: "01 warmup IK"
    service: "/unified_planner/warmup_ik"
    type: isaac_ros_cumotion_interfaces/srv/WarmupIK
    data:
      batch_size: 1
    expect: {success: True}

  - name: "02 warmup FK"
    service: "/unified_planner/warmup_fk"
    type: isaac_ros_cumotion_interfaces/srv/WarmupFK
    data:
      batch_size: 1
    expect: {success: True}

  - name: "03 IK valid pose"
    service: "/unified_planner/ik"
    type: isaac_ros_cumotion_interfaces/srv/Ik
    # Pose == FK of the canonical reachable joint-state B (see C-space home A)
    # for ur10e; an exact FK configuration is a guaranteed IK solution.
    data:
      pose:
        position: {x: 0.3256, y: 0.4438, z: 0.756}
        orientation: {x: 0.7996, y: -0.5934, z: -0.0614, w: 0.0689}
    expect: {joint_states_valid: {data: True}}

  - name: "04 IK invalid pose"
    service: "/unified_planner/ik"
    type: isaac_ros_cumotion_interfaces/srv/Ik
    data:
      pose:
        position: {x: 10.0, y: 10.0, z: 10.0}
        orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    expect: {joint_states_valid: {data: False}}

  - name: "05 FK valid joints"
    service: "/unified_planner/fk"
    type: isaac_ros_cumotion_interfaces/srv/Fk
    data:
      joint_states:
        - position: [0.0, -2.2, 1.9, -1.383, -1.57, 0.0]
    expect: {}
