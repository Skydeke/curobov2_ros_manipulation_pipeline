---
# Franka Emika Panda — reference-benchmark comparison config.
#
# Identical to `franka.curobo.yml` except for the delta curobo core's benchmark
# applies to the bundled franka.yml (`benchmark/motion_plan_benchmark.py
# load_curobo`), so the ROS-wrapped planner in the parity benchmark solves the
# SAME robometrics goal poses in the SAME tool frame as the native leg:
#
#   - tool_frames: [panda_hand]  (the robometrics/goal poses are defined for
#     the panda_hand tool frame; the product default [grasping_frame] sits
#     ~finger-length further out and makes the same goals un-reachable)
#
#   - collision_sphere_buffer: 0.0 for all links (the benchmark's load_curobo
#     forces this to 0.0; the product default 0.004 would inflate every world/
#     obstacle collision sphere by 4 mm the native leg does not have)
#
# `attached_object` (grasp-only) is re-parented onto panda_hand so the config
# stays self-consistent once grasping_frame is not a tool frame anymore; the
# benchmark sends no attached payloads.
#
# The remaining solver recipe (particle+LBFGS ik/trajopt — the default solver
# recipe — collision_activation_distance 0.0025) is set at launch via the
# `max_attempts` / `collision_activation_distance` launch args (see
# docker/compose_benchmark.yaml; max_attempts:=1 by default, raised via
# CUROBO_MAX_ATTEMPTS for the cost-scaling curve).
robot_cfg:
  kinematics:
    collision_spheres:
      panda_link0:
        - center: [0.0, 0.0, 0.085]
          radius: 0.03
        - center: [-0.1, 0.0, 0.085]
          radius: 0.03
