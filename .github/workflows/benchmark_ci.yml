name: cuRobo benchmark CI

on:
  push:
    branches: [main, master]
    paths:
      - 'isaac_ros_cumotion_benchmark/**'
      - 'isaac_ros_cumotion/**'
      - 'isaac_ros_cumotion_interfaces/**'
      - 'docker/**'
      - '.github/workflows/benchmark_ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'isaac_ros_cumotion_benchmark/**'
      - 'isaac_ros_cumotion/**'
      - 'isaac_ros_cumotion_interfaces/**'
      - 'docker/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE: isaac_ros_cumotion:ci

jobs:
  build:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DOCKER_IMAGE }} \
            -f docker/Dockerfile.cumotion \
            --network host \
            .

      - name: Check image size
        run: docker images ${{ env.DOCKER_IMAGE }} --format '{{.Size}}'

      - name: Start curobo_server_node
        run: |
          docker compose -f docker/compose_benchmark.yaml up -d curobo_server
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if docker compose -f docker/compose_benchmark.yaml exec -T curobo_server \
              bash -c 'source /opt/ros/jazzy/setup.bash && source /root/ros2_ws/install/setup.bash && ros2 action list 2>/dev/null | grep -q cumotion/plan_motion'; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run core benchmark (demo)
        run: |
          docker compose -f docker/compose_benchmark.yaml run --rm \
            -e ROS_DOMAIN_ID \
            curobo_benchmark bash -c '
              source /opt/ros/jazzy/setup.bash &&
              source /root/ros2_ws/install/setup.bash &&
              ros2 run isaac_ros_cumotion_benchmark curobo_benchmark core --dataset demo --capability planning --output /tmp/core_planning.json &&
              echo "--- CORE PLANNING ---" &&
              cat /tmp/core_planning.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"Success: {sum(1 for r in d if r[\"success\"])}/{len(d)}\")"
            '

      - name: Run core IK benchmark (demo)
        run: |
          docker compose -f docker/compose_benchmark.yaml run --rm \
            -e ROS_DOMAIN_ID \
            curobo_benchmark bash -c '
              source /opt/ros/jazzy/setup.bash &&
              source /root/ros2_ws/install/setup.bash &&
              ros2 run isaac_ros_cumotion_benchmark curobo_benchmark core --dataset demo --capability ik --output /tmp/core_ik.json &&
              echo "--- CORE IK ---" &&
              cat /tmp/core_ik.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"Success: {sum(1 for r in d if r[\"success\"])}/{len(d)}\")"
            '

      - name: Run core FK benchmark (demo)
        run: |
          docker compose -f docker/compose_benchmark.yaml run --rm \
            -e ROS_DOMAIN_ID \
            curobo_benchmark bash -c '
              source /opt/ros/jazzy/setup.bash &&
              source /root/ros2_ws/install/setup.bash &&
              ros2 run isaac_ros_cumotion_benchmark curobo_benchmark core --dataset demo --capability fk --output /tmp/core_fk.json &&
              echo "--- CORE FK ---" &&
              cat /tmp/core_fk.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"Success: {sum(1 for r in d if r[\"success\"])}/{len(d)}\")"
            '

      - name: Run core collision benchmark (demo)
        run: |
          docker compose -f docker/compose_benchmark.yaml run --rm \
            -e ROS_DOMAIN_ID \
            curobo_benchmark bash -c '
              source /opt/ros/jazzy/setup.bash &&
              source /root/ros2_ws/install/setup.bash &&
              ros2 run isaac_ros_cumotion_benchmark curobo_benchmark core --dataset demo --capability collision --output /tmp/core_collision.json &&
              echo "--- CORE COLLISION ---" &&
              cat /tmp/core_collision.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"Completed: {len(d)} checks\")"
            '

      - name: Run ROS benchmark (planning through node)
        run: |
          docker compose -f docker/compose_benchmark.yaml run --rm \
            -e ROS_DOMAIN_ID \
            curobo_benchmark bash -c '
              source /opt/ros/jazzy/setup.bash &&
              source /root/ros2_ws/install/setup.bash &&
              ros2 run isaac_ros_cumotion_benchmark curobo_benchmark ros --dataset demo --capability planning --output /tmp/ros_planning.json &&
              echo "--- ROS PLANNING ---" &&
              cat /tmp/ros_planning.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"Success: {sum(1 for r in d if r[\"success\"])}/{len(d)}\")"
            '

      - name: Compare core vs ROS planning results
        run: |
          docker compose -f docker/compose_benchmark.yaml run --rm \
            -e ROS_DOMAIN_ID \
            curobo_benchmark bash -c '
              source /opt/ros/jazzy/setup.bash &&
              source /root/ros2_ws/install/setup.bash &&
              ros2 run isaac_ros_cumotion_benchmark curobo_benchmark compare /tmp/core_planning.json /tmp/ros_planning.json --output /tmp/compare.json
            '

      - name: Run full test suite
        run: |
          docker compose -f docker/compose_benchmark.yaml run --rm \
            -e ROS_DOMAIN_ID \
            curobo_test bash -c '
              source /opt/ros/jazzy/setup.bash &&
              source /root/ros2_ws/install/setup.bash &&
              python3 -m pytest /root/ros2_ws/src/isaac_ros_cumotion_benchmark/test/ \
                -v --tb=short -x -p no:cacheprovider \
                -p no:launch_testing -p no:launch_ros \
                -W ignore::pytest.PytestUnknownMarkWarning --no-header 2>&1 |
                tee /tmp/pytest_results.log;
              echo "--- pytest exit code: $? ---"
            '

      - name: Teardown
        if: always()
        run: docker compose -f docker/compose_benchmark.yaml down --remove-orphans

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            /tmp/core_*.json
            /tmp/ros_*.json
            /tmp/compare.json
            /tmp/pytest_results.log
