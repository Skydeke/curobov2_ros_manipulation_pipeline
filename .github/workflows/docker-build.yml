name: Build and publish Docker image

on:
  push:
    branches: [curobo_v2]
    paths:
      - docker/Dockerfile.cumotion
      - isaac_ros_cumotion/**
      - isaac_ros_cumotion_interfaces/**
      - isaac_ros_goal_setter_interfaces/**
      - isaac_ros_cumotion_robot_description/**
      - isaac_ros_cumotion_moveit/**
      - isaac_ros_moveit_goal_setter/**
      - isaac_ros_esdf_visualizer/**
      - isaac_ros_cumotion_examples/**
      - isaac_ros_cumotion_benchmark/**
      - curobo_core/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: isaac-ros-cumotion

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare submodule git metadata for Docker
        shell: bash
        run: |
          set -euxo pipefail

          for sub in curobo_core; do
            (
              cd "$sub"

              git fetch --force --tags origin || true

              if [ -f .git ]; then
                gitdir=$(sed 's/^gitdir: //' .git)
                rm .git
                cp -a "$gitdir" .git
              fi
            )
          done

      - name: Verify curobo git metadata
        shell: bash
        run: |
          set -euxo pipefail

          cd curobo_core

          pwd
          ls -la
          git rev-parse --is-inside-work-tree
          git rev-parse HEAD
          git describe --tags || true
          git status

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cumotion
          push: true
          network: host
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
