name: Build and publish Docker image

on:
  push:
    branches: [curobo_v2]
    paths:
      - docker/Dockerfile.cumotion
      - isaac_ros_cumotion/**
      - isaac_ros_cumotion_interfaces/**
      - isaac_ros_cumotion_moveit/**
      - isaac_ros_cumotion_rviz/**
      - isaac_ros_cumotion_extra/**
      - curobo/**
      - .github/workflows/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: isaac-ros-cumotion

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # NOTE: there is deliberately no step that materialises the nested
      # curobo/curobo .git into the build context any more. It used to run
      # `rm .git; cp -a "$gitdir" .git` so that COPY brought a real .git
      # directory, purely so setuptools-scm could derive a version inside the
      # image (hence SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NVIDIA_CUROBO). The
      # curobo ROS package now pins the version itself, so nothing in the build
      # reads that metadata -- and since there is no .dockerignore, materialising
      # it was copying cuRobo's whole git history into both the build context and
      # the image. actions/checkout already populated the worktree, which is all
      # COPY needs.

      - name: Verify vendored curobo checkout
        shell: bash
        run: |
          set -euxo pipefail

          cd curobo/curobo

          pwd
          ls -la
          git rev-parse --is-inside-work-tree
          git rev-parse HEAD
          git describe --tags || true
          git status

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cumotion
          push: true
          network: host
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
