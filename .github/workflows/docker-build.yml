name: Build and publish Docker image

on:
  push:
    branches: [main, master]
    paths:
      - 'docker/Dockerfile.cumotion'
      - 'isaac_ros_cumotion/**'
      - 'isaac_ros_cumotion_interfaces/**'
      - 'isaac_ros_cumotion_robot_description/**'
      - 'isaac_ros_cumotion_moveit/**'
      - 'curobo_core/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: isaac-ros-cumotion

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bake submodule git dirs for Docker COPY
        run: |
          for sub in curobo_core; do
            gitfile="$sub/.git"
            if [ -f "$gitfile" ]; then
              # Fetch tags so setuptools-scm can determine version
              git -C "$sub" fetch --tags --unshallow origin 2>/dev/null || true
              # Replace .git file with a real directory so Docker COPY picks it up
              gitdir=$(head -1 "$gitfile" | cut -d' ' -f2)
              rm -f "$gitfile"
              cp -a "$gitdir" "$sub/.git"
            fi
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cumotion
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          network: host
