# Interactive Franka Emika Panda session: RViz + cuRobo planner.
#
# Launches the fork's own gen_traj.launch.py against the Pandas (robot:=franka):
# unified_planner (cuRobo solvers run on the GPU), the emulator strategy as the
# joint-state source, robot_state_publisher / joint_state_publisher, and RViz
# (gui:=true). The robot model resolves in-package (robots/franka.yaml ->
# package://isaac_ros_cumotion/config/franka.curobo.yml).
#
# The image is pulled from the pipeline-built fork image on GHCR (the CI
# workflow docker-build.yml rebuilds it on every curobo_v2 push and tags it
# :latest from the default branch). The fork root is bind-mounted at the ROS
# workspace src, so launch/config/robots edits apply live (colcon build uses
# --symlink-install) without rebuilding the image.
#
# The image is pulled from the pipeline-built fork image on GHCR by default,
# or rebuilt locally from docker/Dockerfile.cumotion with --build.
#
# Usage:
#   docker compose -f docker/franka.yaml up
#   # pull the freshest pipeline image, then start:
#   docker compose -f docker/franka.yaml pull && docker compose -f docker/franka.yaml up
#   # rebuild locally instead of pulling:
#   docker compose -f docker/franka.yaml up --build
#   # hard-recreate the container:
#   docker compose -f docker/franka.yaml up --force-recreate
services:
  curobo:
    container_name: isaac_cumotion_franka
    image: ghcr.io/skydeke/isaac_ros_cumotion/isaac-ros-cumotion:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.cumotion
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: $DISPLAY
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
      ROS_DOMAIN_ID: $ROS_DOMAIN_ID
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
      - ..:/root/ros2_ws/src
    command:
      - bash
      - -c
      - |
        set -e
        source /opt/ros/jazzy/setup.bash
        source /root/ros2_ws/install/setup.bash
        exec ros2 launch isaac_ros_cumotion gen_traj.launch.py robot:=franka gui:=true \
          publish_plan_debug_image:=true \
          rviz_config:=/root/ros2_ws/src/isaac_ros_cumotion/rviz/franka_curobo.rviz