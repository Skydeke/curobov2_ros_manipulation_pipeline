services:
  curobo_server:
    container_name: curobo_benchmark_server
    image: isaac_ros_cumotion:benchmark
    build:
      context: ..
      dockerfile: docker/Dockerfile.cumotion
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: $DISPLAY
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
      ROS_DOMAIN_ID: $ROS_DOMAIN_ID
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
      - ..:/root/ros2_ws/src
    command:
      - bash
      - -c
      - |
        source /opt/ros/jazzy/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 run isaac_ros_cumotion curobo_server_node \
          --ros-args \
          -p robot:=/root/ros2_ws/src/isaac_ros_cumotion_robot_description/xrdf/franka.xrdf \
           -p urdf_path:=/opt/ros/jazzy/share/moveit_resources_panda_description/urdf/panda.urdf

  curobo_benchmark:
    container_name: curobo_benchmark
    image: isaac_ros_cumotion:benchmark
    depends_on:
      curobo_server:
        condition: service_started
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: $DISPLAY
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
      ROS_DOMAIN_ID: $ROS_DOMAIN_ID
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
      - ..:/root/ros2_ws/src
    command:
      - bash
      - -c
      - |
        source /opt/ros/jazzy/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        echo "Waiting for cumotion/plan_motion..." &&
        while ! ros2 action list 2>/dev/null | grep -q cumotion/plan_motion; do sleep 1; done &&
        echo "Server ready, running benchmark..." &&
        ros2 run isaac_ros_cumotion_benchmark curobo_benchmark all --dataset demo --output /tmp/benchmark_report.json
        tail -f /dev/null
