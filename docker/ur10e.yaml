# Interactive Universal Robots UR10e session: RViz + cuRobo planner.
#
# Launches the fork's own gen_traj.launch.py against the UR10e (robot:=ur10e):
# unified_planner (cuRobo solvers run on the GPU), the emulator strategy as the
# joint-state source, robot_state_publisher / joint_state_publisher, and RViz
# (gui:=true). The robot model resolves in-package (robots/ur10e.yaml ->
# package://isaac_ros_cumotion/config/ur10e.curobo.yml).
#
# The image is pulled from the pipeline-built fork image on GHCR by default,
# or rebuilt locally from docker/Dockerfile.cumotion with --build. Franka and
# UR10e sessions share the same image — only robot:=... selects the model, so
# there is no per-robot tag. The fork root is bind-mounted at the ROS workspace
# src, so launch/config/robots edits apply live (colcon build uses
# --symlink-install) without rebuilding.
#
# Usage:
#   docker compose -f docker/ur10e.yaml up
#   # pull the freshest pipeline image, then start:
#   docker compose -f docker/ur10e.yaml pull && docker compose -f docker/ur10e.yaml up
#   # rebuild locally instead of pulling:
#   docker compose -f docker/ur10e.yaml up --build
#   # hard-recreate the container:
#   docker compose -f docker/ur10e.yaml up --force-recreate
services:
  curobo:
    container_name: isaac_cumotion_ur10e
    image: ghcr.io/skydeke/isaac_ros_cumotion/isaac-ros-cumotion:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.cumotion
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: $DISPLAY
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
      ROS_DOMAIN_ID: $ROS_DOMAIN_ID
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
      - ..:/root/ros2_ws/src
    command:
      - bash
      - -c
      - |
        set -e
        source /opt/ros/jazzy/setup.bash
        source /root/ros2_ws/install/setup.bash
        exec ros2 launch isaac_ros_cumotion gen_traj.launch.py robot:=ur10e gui:=true \
          rviz_config:=/root/ros2_ws/src/isaac_ros_cumotion/rviz/ur10e_curobo.rviz