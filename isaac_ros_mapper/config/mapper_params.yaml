/curobo_mapper_node:
  ros__parameters:
    # TSDF voxel size (m)
    tsdf_voxel_size: 0.02
    # ESDF voxel size (m) — same as TSDF to match cumotion_params.yaml
    esdf_voxel_size: 0.02
    # Physical extent of the map volume (m) — matches grid_size_m in cumotion_params.yaml
    grid_size_m: [5.0, 5.0, 5.0]
    # Center of the map volume in world coordinates (m)
    grid_center_m: [0.0, 0.0, 0.0]
    # Depth range limits (m)
    depth_minimum_distance: 0.05
    depth_maximum_distance: 5.0
    # TSDF truncation distance (m); if <= 0, uses voxel_size × 4
    truncation_distance: -1.0
    # Minimum TSDF weight for a voxel to be considered observed
    minimum_tsdf_weight: 1.0
    # Per-frame weight decay (1.0 = no decay, 0.3 = fast decay for live mapping)
    decay_factor: 0.3
    # Block size in voxels (2 or powers of 2 in [2, 32])
    block_size: 2
    # Surface roughness multiplier for block allocation
    roughness: 3.0

    # Camera configuration
    camera_correction_frame: ["curobo_frame"]
    num_cameras: 1
    device: "cuda:0"

    # Depth filtering (same filter as live_volumetric_mapping_mpc.py)
    filter_depth: true

    # Integration rate — how often to pull buffered depth into the mapper (Hz)
    integrate_rate_hz: 20.0

    # Debug: publish CUBE_LIST marker with ESDF voxels (set to True to enable)
    publish_debug_voxels: true
    debug_voxel_publish_rate_hz: 1.0
