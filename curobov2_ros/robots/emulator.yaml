# Robot descriptor — RViz emulator (no hardware).
#
# The emulator is a robot-ABSTRACT control strategy: it publishes planned
# JointStates to /emulator/joint_states purely for visualization, with no
# physical driver.
#
# This descriptor intentionally ships WITHOUT a `curobo_config` (no robot model
# baked into the package). To run the emulator against a real robot model,
# supply the model at launch via the `robot_config_file` parameter (the robot's
# own repo provides its cuRobo config + URDF), or drop an emulator descriptor
# into the robot repo overriding this one.
name: emulator
display_name: "Emulator (RViz, model supplied at launch)"

strategy: emulator
strategy_params:
  joint_states_topic: /emulator/joint_states
